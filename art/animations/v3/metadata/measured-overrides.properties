# Measured technical cell selection. Original source PNGs remain untouched.
# In ronaldo-combo.png, launcher_5's ball starts at global y=900,
# while heavy_5's disjoint left boot also ends at y=900. The ball must
# remain complete in launcher_5 without contaminating heavy_5.
ronaldo.heavy.5.excludeRects=105,204,70,15
ronaldo.launcher.5.rect=916,898,229,247
ronaldo.launcher.5.excludeRects=0,0,159,5
# Do Mixi's light_3_3 arc and light_3_4 boot overlap in X but are
# vertically disjoint. Retain the full arc above y=578 and the full
# next-frame boot below it; no pixel belonging to either pose is lost.
do_mixi.light_3.3.rect=467,458,252,229
do_mixi.light_3.3.excludeRects=243,120,9,109
do_mixi.light_3.4.excludeRects=0,0,14,120
# Launcher_4 starts at y=887; move only this cell's crop up one px.
# Heavy_4 above this column ends y=882, so both poses retain alpha gutters.
do_mixi.launcher.4.rect=687,886,208,259
# Ronaldo reaction air_attack_3 is a wide kick with its ball still owned
# by frame 3; the next fighter starts x=799. The empty separator is x=797.
ronaldo.air_attack.3.rect=458,0,339,254
ronaldo.air_attack.4.rect=797,0,187,254
ronaldo.air_attack.5.rect=984,0,161,254
# The horizontal airborne kick uses its pelvis (global x=592) as root,
# preserving the compact 64px actor and the full ball without global shrink.
ronaldo.air_attack.3.rootX=134
# Phan block_4's first beam pixel is at y=288; only air/charge are new.
phan_si_kien.air_attack.4.rect=717,0,218,288
# Air slash 3 anchors its airborne pelvis, not the trailing boot.
phan_si_kien.air_attack.3.rootX=100
# The skill-I thrust uses the centre between both planted boots.
phan_si_kien.skill_i.3.rootX=107
phan_si_kien.skill_i.4.rootX=116
# Keep the tiny skill-U impact particles through global x=880.
ronaldo.skill_u.3.rect=591,0,293,299
ronaldo.skill_u.4.rect=883,0,372,299
# Last block_3 sound-wave pixel is x=678; block_4 starts x=682.
do_mixi.block.3.rect=454,243,226,222
# Block_4's last sound-wave fleck is x=921,y=371..377, while
# block_5's boot reaches x=921 only near the bottom of the row.
do_mixi.block.4.rect=679,243,245,222
do_mixi.block.4.excludeRects=242,157,3,65
do_mixi.block.5.excludeRects=0,0,5,157
# Kicking skill U uses the planted hip/leg root at global x=1016.
ronaldo.skill_u.4.rootX=133
# Grounded sword thrusts anchor between their extended stance boots;
# the trailing foot alone would push the complete blade outside canvas.
phan_si_kien.light_1.4.rootX=112
